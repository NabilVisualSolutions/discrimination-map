<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Awareness — Recognizing Far-Right Symbols | Discrimination Map</title>
<meta name="description" content="A factual reference for recognizing banned far-right symbols, gestures, and coded language under German law — so people can recognize it and be aware." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f4f7fb'/%3E%3Cpath d='M11 6v20M21 6v20M11 6l10 20' stroke='%230074AE' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
  :root{
    /* Light theme — matches index.html/admin.html. See frontend/preview-light.html. */
    --bg:#f4f7fb; --panel:#ffffff; --panel-2:#eef2f8;
    --line:#dbe3ee; --line-soft:#e8eef6;
    --ink:#0b1326; --muted:#5b6b85; --faint:#656F7E;
    --accent:#0074AE; --warn:#9C6109;
    --disp:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    --body:Georgia,'Times New Roman',serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  :focus-visible{outline:2px solid var(--user, var(--accent));outline-offset:2px}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
    font-size:18px;line-height:1.7}
  h1,h2,h3,.disp{font-family:var(--disp);letter-spacing:-.01em}
  a{color:var(--accent)}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px}
  section{padding:52px 0}
  .eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--faint);margin-bottom:14px}

  nav{position:sticky;top:0;z-index:100;background:rgba(244,247,251,.9);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft)}
  nav .inner{max-width:760px;margin:0 auto;padding:16px 24px;display:flex;
    justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  nav .brand{display:flex;align-items:center;gap:9px;font-family:var(--disp);
    font-weight:700;font-size:16px;text-decoration:none;color:var(--ink)}
  nav .brand svg{width:20px;height:20px}
  nav a.back{font-family:var(--mono);font-size:13px;color:var(--muted);text-decoration:none}
  nav a.back:hover{color:var(--ink)}
  .langbar{display:flex;gap:6px}
  .langbar button{padding:6px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
    color:var(--muted);font-size:12.5px;cursor:pointer;font-family:var(--disp);transition:border-color .15s,color .15s}
  .langbar button.active{color:var(--accent);border-color:var(--accent)}

  .hero{padding:56px 0 8px}
  .hero h1{font-size:clamp(28px,4.6vw,42px);line-height:1.15;margin:0 0 20px;max-width:640px}
  .hero p.lede{font-size:19px;color:var(--muted);max-width:600px;margin:0}

  .valuesbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:24px 26px;margin-top:30px}
  .valuesbox h3{margin:0 0 10px;font-size:16.5px;font-family:var(--disp)}
  .valuesbox p{margin:0;color:var(--muted);font-size:16px;line-height:1.65}

  .entry{border-top:1px solid var(--line-soft);padding:30px 0}
  .entry h3{font-size:20px;margin:0 0 4px;font-family:var(--disp)}
  .entry .code{font-family:var(--mono);font-size:12px;color:var(--accent);
    letter-spacing:.04em;margin-bottom:12px;display:block}
  .entry p{margin:0 0 10px;font-size:16.5px}
  .entry p:last-child{margin-bottom:0}

  .codelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:10px;margin-top:18px}
  .codeitem{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px}
  .codeitem .k{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--ink)}
  .codeitem .v{font-family:var(--disp);font-size:13.5px;color:var(--muted);margin-top:3px}

  .safetybox{background:rgba(255,176,32,.08);border:1px solid rgba(255,176,32,.28);
    border-radius:14px;padding:26px 28px;margin-top:8px}
  .safetybox h3{margin:0 0 10px;font-family:var(--disp);font-size:17.5px;color:var(--warn)}
  .safetybox p{margin:0 0 10px;color:var(--muted);font-size:16px}
  .safetybox p:last-child{margin-bottom:0}
  .safetybox a.btn{display:inline-flex;margin-top:6px;background:var(--accent);color:#fff;
    padding:12px 20px;border-radius:10px;text-decoration:none;font-family:var(--disp);
    font-weight:700;font-size:15px;transition:transform .15s}
  .safetybox a.btn:hover{transform:translateY(-1px)}

  footer{border-top:1px solid var(--line-soft);padding:40px 0;color:var(--faint);
    font-size:13.5px;font-family:var(--disp)}

  html[dir=rtl] body{font-family:'Traditional Arabic','Times New Roman',var(--body)}
</style>
</head>
<body>

<nav>
  <div class="inner">
    <a class="brand" href="/">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M11 6v20M21 6v20M11 6l10 20" stroke="#0074AE" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <span id="brandText">Discrimination Map</span>
    </a>
    <div style="display:flex;align-items:center;gap:14px">
      <div class="langbar" id="langBar"></div>
      <a class="back" href="/" id="backLink">← Back to the map</a>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="wrap">
    <div class="eyebrow" id="t-eyebrow"></div>
    <h1 id="t-h1"></h1>
    <p class="lede" id="t-lede"></p>

    <div class="valuesbox">
      <h3 id="t-whyTitle"></h3>
      <p id="t-whyBody"></p>
    </div>
  </div>
</header>

<section>
  <div class="wrap">
    <div class="eyebrow" id="t-symbolsEyebrow"></div>
    <h2 style="font-size:26px;margin:0 0 10px" id="t-symbolsTitle"></h2>
    <p style="color:var(--muted);margin:0 0 8px" id="t-symbolsLede"></p>
    <div id="symbolsList"></div>
  </div>
</section>

<section style="padding-top:0">
  <div class="wrap">
    <div class="eyebrow" id="t-codesEyebrow"></div>
    <h2 style="font-size:26px;margin:0 0 10px" id="t-codesTitle"></h2>
    <p style="color:var(--muted);margin:0 0 8px" id="t-codesLede"></p>
    <div class="codelist" id="codesList"></div>
  </div>
</section>

<section style="padding-top:0">
  <div class="wrap">
    <div class="eyebrow" id="t-orgEyebrow"></div>
    <h2 style="font-size:26px;margin:0 0 10px" id="t-orgTitle"></h2>
    <p style="color:var(--muted);margin:0 0 10px" id="t-orgBody"></p>
    <p><a href="https://www.verfassungsschutz.de" target="_blank" rel="noopener noreferrer" id="t-orgLink"></a></p>
  </div>
</section>

<section style="padding-top:0">
  <div class="wrap">
    <div class="safetybox">
      <h3 id="t-safetyTitle"></h3>
      <p id="t-safetyBody"></p>
      <a class="btn" href="/#report" id="t-fileBtn"></a>
    </div>
  </div>
</section>

<footer>
  <div class="wrap" id="t-footer"></div>
</footer>

<script src="/static/i18n.js?v=20260822b"></script>
<script src="/static/awareness-data.js?v=20260822b"></script>
<script>
const I = window.DXMAP_I18N_RUNTIME;

function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>(
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function applyAware(){
  const lang = I.current;
  const d = window.DXMAP_AWARENESS[lang] || window.DXMAP_AWARENESS.en;
  document.documentElement.lang = lang;
  document.documentElement.dir = DXMAP_I18N[lang].dir;
  const simple = {
    't-eyebrow':'eyebrow', 't-h1':'h1', 't-lede':'lede', 't-whyTitle':'whyTitle', 't-whyBody':'whyBody',
    't-symbolsEyebrow':'symbolsEyebrow', 't-symbolsTitle':'symbolsTitle', 't-symbolsLede':'symbolsLede',
    't-codesEyebrow':'codesEyebrow', 't-codesTitle':'codesTitle', 't-codesLede':'codesLede',
    't-orgEyebrow':'orgEyebrow', 't-orgTitle':'orgTitle', 't-orgBody':'orgBody',
    't-safetyTitle':'safetyTitle', 't-safetyBody':'safetyBody', 't-footer':'footer',
  };
  Object.entries(simple).forEach(([id,key])=>{
    const el = document.getElementById(id);
    if(el && d[key] != null) el.textContent = d[key];
  });
  document.getElementById('t-orgLink').textContent = d.orgLink;
  document.getElementById('t-fileBtn').textContent = d.fileBtn;
  document.getElementById('symbolsList').innerHTML = (d.symbols||[]).map(s=>`
    <div class="entry">
      <span class="code">${escapeHtml(s.code)}</span>
      <h3>${escapeHtml(s.title)}</h3>
      <p>${escapeHtml(s.body)}</p>
    </div>`).join('');
  document.getElementById('codesList').innerHTML = (d.codes||[]).map(c=>`
    <div class="codeitem"><div class="k">${escapeHtml(c.k)}</div><div class="v">${escapeHtml(c.v)}</div></div>`).join('');
}
function renderLangBar(){
  document.getElementById('langBar').innerHTML = I.langs.map(l=>
    `<button data-lang="${l}" class="${l===I.current?'active':''}">${DXMAP_I18N[l].name}</button>`).join('');
  document.querySelectorAll('#langBar button').forEach(b=>b.addEventListener('click',()=>{
    I.setLang(b.dataset.lang); renderLangBar(); applyAware();
  }));
}
renderLangBar();
applyAware();
</script>
</body>
</html>
