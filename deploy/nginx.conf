# Hermes Map — Nginx reverse proxy
# Copy to /etc/nginx/sites-available/hermes-map, symlink into sites-enabled,
# replace yourdomain.com, then run: certbot --nginx -d yourdomain.com
# (deploy.sh does all of this for you if you pass a domain.)

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;

    # Certbot will insert the HTTPS server block + redirect automatically
    # when you run `certbot --nginx`. Until then this serves plain HTTP.

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Standard forwarding headers so the app sees the real client.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The app polls itself and serves a live HUD; keep connections open.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Don't let Nginx serve the SQLite DB or .env even if paths are guessed.
    location ~* \.(db|db-wal|db-shm|env)$ {
        deny all;
        return 404;
    }

    client_max_body_size 1m;  # report submissions are small JSON
}
